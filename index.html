<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Viewer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
</head>
<body>
  <div id="controls">
    <button id="renderBtn" type="button">Rendern</button>
    <details id="insertMenu" class="insert-menu">
      <summary>Einfügen</summary>
      <div class="insert-menu-items" role="group" aria-label="Einfügen">
        <button id="loadHtmlBtn" type="button">HTML laden</button>
        <button id="loadCssBtn" type="button">CSS laden</button>
        <button id="loadJsBtn" type="button">JS laden</button>
        <div class="menu-separator" role="separator"></div>
        <button id="createCssBtn" type="button">CSS erstellen</button>
        <button id="createJsBtn" type="button">JS erstellen</button>
      </div>
    </details>
    <button id="exportBtn" type="button">Exportieren (ZIP)</button>
    <button id="cloudSaveBtn" type="button">Cloud speichern</button>
    <button id="cloudLoadBtn" type="button">Cloud laden</button>
    <button id="cloudDeleteBtn" type="button">Cloud löschen</button>
    <button id="importZipBtn" type="button">ZIP importieren</button>
    <button id="importLinkBtn" type="button">ZIP per Link importieren</button>
    <input id="importZipFile" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
    <label><input type="checkbox" id="autoRenderToggle"> Auto-Render</label>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <dialog id="cloudSaveDialog" aria-labelledby="cloudDialogTitle">
    <h2 id="cloudDialogTitle">Projekt in R2 speichern</h2>
    <label>Upload-Passwort <input id="cloudPassword" type="password" autocomplete="off"></label>
    <label>Projektname <input id="cloudProjectName" type="text" value="html-projekt"></label>
    <div class="cloud-browser-toolbar">
      <button type="button" id="cloudFolderReload">Ordner anzeigen / Aktualisieren</button>
      <button type="button" id="cloudFolderBack">↑ Zurück</button>
      <button type="button" id="cloudFolderCreate">+ Neuer Ordner</button>
    </div>
    <p>Aktueller Speicherort: <strong id="cloudFolderPath">projects/</strong></p>
    <div class="cloud-folder-list" id="cloudFolderList" aria-label="Unterordner"></div>
    <div class="cloud-file-list" id="cloudFileList" aria-label="Dateien"></div>
    <div class="cloud-dialog-actions">
      <button type="button" id="cloudFolderCancel">Abbrechen</button>
      <button type="button" id="cloudFolderSave">Hier speichern</button>
    </div>
  </dialog>
  <dialog id="cloudLoadDialog" aria-labelledby="cloudLoadTitle">
    <h2 id="cloudLoadTitle">Projekt aus R2 laden</h2>
    <label>Cloud-Passwort <input id="cloudLoadPassword" type="password" autocomplete="off"></label>
    <div class="cloud-browser-toolbar">
      <button id="cloudLoadReload" type="button">Ordner anzeigen / Aktualisieren</button>
      <button id="cloudLoadBack" type="button">↑ Zurück</button>
    </div>
    <p>Aktueller Ordner: <strong id="cloudLoadPath">projects/</strong></p>
    <div class="cloud-folder-list" id="cloudLoadFolders" aria-label="Unterordner"></div>
    <div class="cloud-file-list" id="cloudLoadFiles" aria-label="ZIP-Dateien"></div>
    <p id="cloudLoadSelected">Noch keine ZIP-Datei ausgewählt.</p>
    <div class="cloud-dialog-actions">
      <button id="cloudLoadCancel" type="button">Abbrechen</button>
      <button id="cloudLoadImport" type="button" disabled>Ausgewähltes ZIP laden</button>
    </div>
  </dialog>
  <dialog id="cloudDeleteDialog" aria-labelledby="cloudDeleteTitle">
    <h2 id="cloudDeleteTitle">Projekte aus R2 löschen</h2>
    <label>Cloud-Passwort <input id="cloudDeletePassword" type="password" autocomplete="off"></label>
    <div class="cloud-browser-toolbar">
      <button id="cloudDeleteReload" type="button">Ordner anzeigen / Aktualisieren</button>
      <button id="cloudDeleteBack" type="button">↑ Zurück</button>
    </div>
    <p>Aktueller Ordner: <strong id="cloudDeletePath">projects/</strong></p>
    <div class="cloud-folder-list" id="cloudDeleteFolders" aria-label="Ordner zum Öffnen oder Löschen"></div>
    <div class="cloud-file-list" id="cloudDeleteFiles" aria-label="ZIP-Dateien zum Löschen"></div>
    <p id="cloudDeleteSelected">Nichts ausgewählt.</p>
    <div class="cloud-dialog-actions">
      <button id="cloudDeleteCancel" type="button">Schließen</button>
      <button id="cloudDeleteConfirm" type="button" disabled>Auswahl löschen</button>
    </div>
  </dialog>
  <div id="main">
    <div id="editor">
      <div id="tabs" role="tablist" aria-label="Code-Editor">
        <button id="tabHtml" class="active" type="button" role="tab">HTML</button>
        <button id="tabCss" type="button" role="tab">CSS</button>
        <button id="tabJs" type="button" role="tab">JS</button>
      </div>
      <div id="htmlEditor"><textarea id="source" placeholder="Hier HTML-Code eingeben"></textarea></div>
      <div id="cssEditor" class="hidden"><textarea id="cssArea" placeholder="Hier CSS-Regeln eingeben"></textarea></div>
      <div id="jsEditor" class="hidden"><textarea id="jsArea" placeholder="Hier JavaScript eingeben"></textarea></div>
    </div>
    <div id="divider" aria-label="Editorbreite ändern"></div>
    <iframe id="preview" title="HTML-Vorschau"></iframe>
  </div>
  <div id="jsOverlay">
    <div id="jsOverlayHeader">Konsole <div><button id="jsOverlayReset" type="button">Reset</button><button id="jsOverlayClose" type="button">X</button></div></div>
    <div id="jsOverlayContent"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
